<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sara de Paiva — Relatórios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      color: white;
      margin-bottom: 40px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 16px;
      opacity: 0.9;
      transition: opacity 0.3s;
    }
    .back-link:hover {
      opacity: 1;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .client-handle {
      font-size: 16px;
      opacity: 0.95;
      font-weight: 300;
    }
    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .report-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
    }
    .report-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }
    .month-name {
      font-size: 22px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 10px;
    }
    .year {
      font-size: 14px;
      color: #999;
      margin-bottom: 20px;
    }
    .view-report-btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.3s;
      border: none;
      cursor: pointer;
    }
    .view-report-btn:hover {
      opacity: 0.9;
    }
    .format-options {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    footer {
      text-align: center;
      color: white;
      margin-top: 50px;
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../" class="back-link">← Voltar para clientes</a>
      <h1>👩‍💼 Sara de Paiva</h1>
      <p class="client-handle">@saradpaiva</p>
    </header>

    <div class="reports-grid" id="reports-grid">
      <!-- Relatórios serão inseridos aqui -->
    </div>

    <footer>
      <p>Relatórios de Performance — Instagram Analytics</p>
    </footer>
  </div>

  <script>
    const reports = [
      { month: "Julho", year: 2026, file: "julho-2026.html" },
      { month: "Junho", year: 2026, file: "junho-2026.html" },
      { month: "Maio", year: 2026, file: "maio-2026.html" }
    ];

    function renderReports() {
      const grid = document.getElementById('reports-grid');
      grid.innerHTML = reports.map(report => `
        <div class="report-card">
          <div class="month-name">${report.month}</div>
          <div class="year">${report.year}</div>
          <a href="${report.file}" class="view-report-btn">
            Abrir Relatório
          </a>
          <div class="format-options">
            📄 HTML interativo
          </div>
        </div>
      `).join('');
    }

    renderReports();
  </script>
</body>
</html>
