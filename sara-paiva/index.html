<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara de Paiva — Relatórios de Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E287F;
    --lime:#DEDF2B;
    --ink:#000;
    --bg:#F7F8FA;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);
    padding:52px 64px 88px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto}

  /* ---------- VOLTAR ---------- */
  .back{
    display:inline-block;color:var(--navy);text-decoration:none;
    font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:44px;transition:opacity .2s ease;
  }
  .back:hover{opacity:.55}

  /* ---------- CABEÇALHO ---------- */
  .client-head{text-align:center;margin-bottom:66px}
  .name-block{display:inline-block;background:var(--navy);padding:11px 30px}
  .name-block h1{
    color:var(--lime);text-transform:uppercase;font-weight:400;
    font-size:clamp(20px,3.4vw,40px);line-height:1.16;letter-spacing:-.01em;
  }
  .name-block h1 b{font-weight:800}
  .handle{
    margin-top:12px;font-size:clamp(10px,.9vw,12px);font-weight:400;
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  }

  /* ---------- LABEL ---------- */
  .label{
    font-size:clamp(10px,.9vw,12px);font-weight:400;letter-spacing:.2em;
    text-transform:uppercase;margin-bottom:18px;
  }

  /* ---------- RELATÓRIOS ---------- */
  .reports{display:flex;flex-direction:column;align-items:flex-start;gap:13px}
  .report{
    background:var(--navy);border:2px solid var(--navy);
    padding:14px 30px;text-decoration:none;
    display:inline-flex;align-items:baseline;gap:11px;
    transition:background .22s ease,transform .22s ease;
  }
  .report .month{
    color:var(--lime);text-transform:uppercase;font-weight:800;
    font-size:clamp(17px,2.3vw,29px);line-height:1.12;letter-spacing:-.01em;
    transition:color .22s ease;
  }
  .report .year{
    color:var(--lime);text-transform:uppercase;font-weight:400;
    font-size:clamp(17px,2.3vw,29px);line-height:1.12;letter-spacing:-.01em;
    transition:color .22s ease;
  }
  .report:hover{background:var(--lime);transform:translateX(5px)}
  .report:hover .month,.report:hover .year{color:var(--navy)}

  .empty{
    border:2px dashed var(--navy);color:var(--navy);
    padding:18px 24px;font-size:14px;
  }

  footer{
    margin-top:64px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#9A9A9A;
  }

  @media(max-width:900px){
    body{padding:44px 40px 72px}
  }
  @media(max-width:620px){
    body{padding:28px 24px 56px}
    .back{margin-bottom:32px}
    .client-head{margin-bottom:48px}
    .name-block{padding:10px 18px}
    .report{padding:12px 20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../">← Voltar</a>

  <!-- ================= CABEÇALHO ================= -->
  <div class="client-head">
    <div class="name-block">
      <h1><b>Sara</b> de Paiva</h1>
    </div>
    <div class="handle">@saradpaiva</div>
  </div>

  <!-- ================= RELATÓRIOS ================= -->
  <div class="label">Relatórios disponíveis</div>
  <div class="reports" id="reports"></div>

  <footer>Casa Fora Comunicação</footer>
</div>

<script>
/* ===================================================================
   PARA ADICIONAR UM NOVO MÊS:
   1. Faça upload do HTML do relatório nesta mesma pasta
      (ex.: agosto-2026.html)
   2. Adicione uma linha no topo da lista abaixo
   =================================================================== */
const reports = [
  { month: "Julho", year: 2026, file: "julho-2026.html" }
];

document.getElementById("reports").innerHTML = reports.length
  ? reports.map(r => `
      <a class="report" href="${r.file}">
        <span class="month">${r.month}</span><span class="year">${r.year}</span>
      </a>
    `).join("")
  : '<div class="empty">Nenhum relatório publicado ainda.</div>';
</script>
</body>
</html>
