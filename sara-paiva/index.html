<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Sara de Paiva</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;padding:40px 20px 64px;color:#1A1D23;
  }
  .wrap{max-width:760px;margin:0 auto}
  .back{
    display:inline-block;background:rgba(255,255,255,.9);color:#667eea;
    padding:9px 18px;border-radius:8px;text-decoration:none;
    font-weight:600;font-size:13px;margin-bottom:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);transition:all .25s;
  }
  .back:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .header{
    background:#fff;border-radius:16px;padding:40px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.15);margin-bottom:28px;
  }
  .header .avatar{font-size:44px;margin-bottom:10px;display:block}
  .header h1{font-size:30px;color:#667eea;margin-bottom:6px}
  .header .handle{font-size:15px;color:#777;margin-bottom:4px}
  .header .sub{font-size:13px;color:#aaa}
  h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:rgba(255,255,255,.85);font-weight:600;margin:0 0 14px 4px;
  }
  .reports{display:grid;gap:14px}
  .report{
    background:#fff;border-radius:12px;padding:24px 26px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    text-decoration:none;color:inherit;
    display:flex;align-items:center;justify-content:space-between;
    transition:transform .25s,box-shadow .25s;
  }
  .report:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .report .month{font-size:22px;font-weight:700;color:#667eea}
  .report .year{font-size:13px;color:#999;margin-top:2px}
  .report .arrow{font-size:22px;color:#764ba2}
  .empty{
    background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.45);
    border-radius:12px;padding:22px;text-align:center;
    color:rgba(255,255,255,.9);font-size:14px;
  }
  footer{
    text-align:center;color:rgba(255,255,255,.7);font-size:12px;
    margin-top:40px;line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../">← Voltar ao dashboard</a>

  <div class="header">
    <span class="avatar">👩‍💼</span>
    <h1>Sara de Paiva</h1>
    <div class="handle">@saradpaiva</div>
    <div class="sub">Relatórios mensais de performance no Instagram</div>
  </div>

  <h2>Relatórios disponíveis</h2>
  <div class="reports" id="reports"></div>

  <footer>
    <p>Casa Fora · Relatórios de performance</p>
  </footer>
</div>

<script>
/* ===================================================================
   PARA ADICIONAR UM NOVO MÊS:
   1. Faça upload do HTML do relatório nesta mesma pasta
      (ex.: agosto-2026.html)
   2. Adicione uma linha no topo da lista abaixo
   =================================================================== */
const reports = [
  { month: "Julho", year: 2026, file: "julho-2026.html" }
];

const container = document.getElementById("reports");
container.innerHTML = reports.length
  ? reports.map(r => `
      <a class="report" href="${r.file}">
        <div>
          <div class="month">${r.month}</div>
          <div class="year">${r.year}</div>
        </div>
        <div class="arrow">→</div>
      </a>
    `).join("")
  : '<div class="empty">Nenhum relatório publicado ainda.</div>';
</script>
</body>
</html>
